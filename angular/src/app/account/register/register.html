<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Crear una cuenta</h2>
      <p>Únete a ExploraYa hoy mismo</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="userName">Nombre de Usuario</label>
        <input 
          id="userName" 
          type="text" 
          formControlName="userName" 
          class="form-control" 
          placeholder="Ej: viajerofeliz"
        />
        <div class="error-text" *ngIf="registerForm.get('userName')?.touched && registerForm.get('userName')?.invalid">
          El nombre de usuario es requerido (mínimo 3 caracteres).
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          class="form-control" 
          placeholder="ejemplo@correo.com"
        />
        <div class="error-text" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
          Ingresa un correo electrónico válido.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          class="form-control" 
          placeholder="Mínimo 6 caracteres"
        />
        <div class="error-text" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
          La contraseña es requerida (mínimo 6 caracteres).
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="registerForm.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        Registrarse
      </button>

      <div class="auth-footer mt-4 text-center">
        <p>¿Ya tienes una cuenta? <a routerLink="/account/login">Inicia sesión</a></p>
        <p class="mt-2"><a routerLink="/">Volver al inicio</a></p>
      </div>
    </form>
  </div>
</div>
