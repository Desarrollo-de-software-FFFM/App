<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Bienvenido a ExploraYa</h2>
      <p>Inicia sesión en tu cuenta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="userNameOrEmail">Usuario o Email</label>
        <input 
          id="userNameOrEmail" 
          type="text" 
          formControlName="userNameOrEmail" 
          class="form-control" 
          placeholder="ejemplo@correo.com"
        />
        <div class="error-text" *ngIf="loginForm.get('userNameOrEmail')?.touched && loginForm.get('userNameOrEmail')?.invalid">
          El usuario o email es requerido.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          class="form-control" 
          placeholder="Tu contraseña"
        />
        <div class="error-text" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          La contraseña es requerida.
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        Iniciar Sesión
      </button>

      <div class="auth-footer mt-4 text-center">
        <p>¿No tienes una cuenta? <a routerLink="/auth/register">Regístrate aquí</a></p>
        <p class="mt-2"><a routerLink="/">Volver al inicio</a></p>
      </div>
    </form>
  </div>
</div>
