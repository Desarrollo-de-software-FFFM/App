<div class="container mt-4">
  <h2>Mis Favoritos</h2>

  <div *ngIf="isLoading" class="text-center my-4">
    <span class="spinner-border" role="status"></span>
    <span class="ms-2">Cargando...</span>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && favoritos.length === 0 && !errorMessage" class="alert alert-info">
    No tienes destinos favoritos aún.
  </div>

  <ul *ngIf="!isLoading && favoritos.length > 0" class="list-group">
    <li
      *ngFor="let favorito of favoritos"
      class="list-group-item d-flex justify-content-between align-items-center"
    >
      <span>{{ favorito.destinoTuristicoId }}</span>
      <button
        class="btn btn-sm btn-outline-danger"
        (click)="removeFavorito(favorito.destinoTuristicoId)"
      >
        Eliminar
      </button>
    </li>
  </ul>
</div>
